<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<title>Ready for Work Academy</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark;--bg:#0c1022;--cd:#161c3a;--cd2:#212a55;--tx:#f4f6ff;--mu:#9fa9d9;--ln:#2d3668;--ac:#7c5cff;--ac2:#18d5ff}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){color-scheme:light;--bg:#eef1ff;--cd:#fff;--cd2:#e8ebff;--tx:#141a3a;--mu:#586197;--ln:#d2d8f5}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0c1022;--cd:#161c3a;--cd2:#212a55;--tx:#f4f6ff;--mu:#9fa9d9;--ln:#2d3668}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;color:var(--tx);font:16px/1.5 "Nunito","Trebuchet MS",system-ui,sans-serif;background:radial-gradient(circle at 0 0,#7c5cff40,transparent 45%),radial-gradient(circle at 100% 40%,#18d5ff26,transparent 40%),var(--bg);background-attachment:fixed;overflow-x:hidden}
#app{max-width:560px;margin:0 auto;padding:16px 16px 48px}
h1,h2{font-weight:900;line-height:1.15;margin:0 0 8px}
h1{font-size:28px}h2{font-size:21px}
p{margin:6px 0}.mu{color:var(--mu)}
.top{background:linear-gradient(135deg,#6d4aff,#12b8ff);color:#fff;border-radius:22px;padding:18px;margin-bottom:10px;box-shadow:0 6px 0 #3b25a8}
.bar{height:14px;background:#0000004d;border-radius:9px;overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;background:#ffe14d;border-radius:9px;transition:width .5s}
.bds{display:flex;gap:10px;margin:12px 0 2px}.bd{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:#ffffff26;border:2px dashed #ffffff80;opacity:.4;filter:grayscale(1)}.bd.on{background:var(--c);border:2px solid #fff;opacity:1;filter:none;box-shadow:0 0 0 3px #ffffff4d}
.map{position:relative}
.map svg{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible}
.st{position:absolute;width:72px;height:72px;margin:-36px 0 0 -36px;padding:0;border:0;border-radius:50%;background:var(--c);color:#111;font-size:28px;display:grid;place-items:center;cursor:pointer;box-shadow:0 6px 0 #00000059}
.st.xm{width:88px;height:88px;margin:-44px 0 0 -44px;font-size:36px;border:5px solid #ffe14d}
.st.done{filter:saturate(.8)}
.st.lk{background:var(--ln);color:var(--mu);cursor:not-allowed;box-shadow:0 6px 0 #0003}
.st.cur{animation:pulse 1.3s infinite}
@keyframes pulse{50%{box-shadow:0 6px 0 #00000059,0 0 0 11px color-mix(in srgb,var(--c) 35%,transparent)}}
.lb{position:absolute;transform:translateX(-50%);width:132px;text-align:center;font-size:13px;font-weight:800;line-height:1.2}
.av{position:absolute;z-index:3;font-size:36px;margin:-96px 0 0 -18px;transition:left .7s ease-in-out,top .7s ease-in-out;pointer-events:none;filter:drop-shadow(0 4px 3px #0006)}
.av.hop{animation:hop .7s}
@keyframes hop{50%{transform:translateY(-38px)}}
@media (prefers-reduced-motion:reduce){.av,.st.cur,.card{animation:none;transition:none}}
.btn,.opt,.back{font:inherit;color:inherit;cursor:pointer;display:block;width:100%;text-align:left;padding:13px 14px;margin:9px 0;border-radius:16px}
.btn{border:0;border-bottom:5px solid #4a2fd0;background:var(--ac);color:#fff;font-weight:900;text-align:center}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:not(:disabled):active{transform:translateY(3px);border-bottom-width:2px}
.back{width:auto;display:inline-block;padding:6px 14px;margin:0 0 12px;background:var(--cd);border:2px solid var(--ln);font-weight:800}
.card{background:var(--cd);border:2px solid var(--ln);border-bottom:6px solid var(--dc,var(--ac));border-radius:20px;padding:18px;margin:12px 0;animation:pop .25s}
@keyframes pop{from{transform:scale(.97);opacity:.4}}
.dots{display:flex;gap:6px;margin:4px 0 8px}.dots i{flex:1;height:9px;border-radius:5px;background:var(--ln)}.dots i.on{background:var(--dc)}
.x{color:#f0506a;font-weight:800}.g{color:#14a870;font-weight:800}
.opt{background:var(--cd);border:2px solid var(--ln);border-bottom-width:4px;font-weight:700}
.opt.sel{border-color:var(--ac2);background:var(--cd2)}
.opt.good{background:#1f9d5a;border-color:#137a42;color:#fff}
.opt.bad{background:#d94a5a;border-color:#a8323f;color:#fff}
.win{background:#1f9d5a;border-color:#137a42;color:#fff;font-weight:900;text-align:center}
.lose{background:#d94a5a;border-color:#a8323f;color:#fff;font-weight:800}
.cert{background:#fffbe8;color:#1a1240;border:6px double #b8860b;border-radius:14px;text-align:center;padding:24px 14px;margin:14px 0}
.cert b.n{display:block;font:900 28px "Nunito",sans-serif;border-bottom:2px solid #1a1240;margin:10px 0;min-height:44px}
input{font:inherit;width:100%;padding:12px;border:2px solid var(--ln);border-radius:14px;background:var(--cd);color:var(--tx)}
@media print{body *{visibility:hidden}.cert,.cert *{visibility:visible}.cert{position:absolute;left:0;top:0;width:100%}}
</style></head><body><div id="app"></div>
<script>
// card = [name, emoji, learn, [excuse, reality], challenge, quiz1, quiz2]; quiz = [question, right, wrong, wrong]
const D=[
["Dependability","⏰","#ff6b6b","People can count on you.",[
["Attendance","📅","Attendance means showing up consistently when you’re expected. When one worker is missing, others do more, customers wait longer, and stress rises.",["“My friends skip work all the time.”","Your employer isn’t paying your friends. They’re paying YOU."],"Two employees do equal-quality work. One misses twice a month. Who’s more valuable, and why?",["What is attendance?","Showing up consistently when expected","Showing up when you feel like it","Only coming on busy days"],["Jake misses work all the time. Sarah almost never does. A promotion opens up. Who does the manager consider first?","Sarah","Jake","Whoever has more friends"]],
["Punctuality","⏱️","Punctuality means arriving early enough to be READY when work starts. Present isn’t enough. If 10 workers are 5 minutes late, that’s 50 minutes lost.",["“It’s only five minutes.”","Five minutes becomes hours over a year, and employers notice patterns."],"How early should you arrive for work? A job interview? A college class?",["Worker A arrives 7:55 for an 8:00 start. Worker B arrives 8:03 and grabs coffee. Who’s more professional?","Worker A","Worker B","Both the same"],["Why does lateness matter?","Lost time adds up and affects others","It doesn’t matter","Only managers care"]],
["Following Schedules & Policies","📋","Policies are workplace rules: safety, attendance, dress code, technology. Most exist because someone caused a problem before. They protect employees, customers and businesses.",["“Nobody checks.”","Integrity means doing the right thing even when nobody is watching."],"Should workers follow rules they disagree with? Why?",["Why do policies exist?","To protect people and the business","To annoy workers","To slow down work"],["A warehouse worker ignores a forklift rule. What can happen?","Accident, injury and equipment damage","Nothing","A promotion"]]
]],
["Productivity","⚙️","#ffd93d","Creating valuable results efficiently.",[
["Staying On Task","🎯","Staying on task means focusing on the work you were hired to do. Every distraction reduces productivity.",["“I can multitask.”","Constantly switching attention makes most people perform worse."],"Which distractions hurt your productivity the most?",["Employee A checks social media every 5 minutes. Employee B stays focused. After 4 hours, who got more done?","Employee B","Employee A","Same"],["Why do employers care about focus?","They pay for productive work","They like quiet offices","They don’t care"]],
["Work Quality","✅","Work quality means doing work correctly and accurately. Mistakes cost time, money and customers.",["“Nobody will notice.”","Customers and supervisors notice quality."],"Would you rather have a surgeon who works quickly or accurately? Why?",["Worker A is fast but makes errors. Worker B is accurate. Who creates more value?","Worker B","Worker A","Neither"],["Why is accuracy important?","Errors cost time, money and customers","It isn’t","It only matters to managers"]],
["Work Pace & Efficiency","🚀","Efficiency means producing quality work with minimal wasted time. Efficient workers plan ahead, stay organized and reduce waste.",["“Slow work is always careful work.”","Efficient workers balance speed and quality."],"What habits would make you more efficient?",["Two workers finish identical projects at equal quality: one in 8 hours, one in 5. Who’s more efficient?","The 5-hour worker","The 8-hour worker","Neither"],["What is efficiency?","Quality work with minimal wasted time","Working as fast as possible","Working the longest hours"]]
]],
["Professionalism","👔","#4dabf7","Building trust and confidence.",[
["Professional Appearance","😎","Professional appearance builds trust. People notice hygiene, clothing, posture and body language before they notice your skills.",["“People shouldn’t judge appearances.”","First impressions affect hiring every day, and customers notice too."],"What could you do tomorrow to look more professional?",["What do people notice before your skills?","Hygiene, clothing and posture","Your test scores","Your hobbies"],["Two applicants arrive: one prepared, one careless. Who makes the stronger first impression?","The prepared one","The careless one","Neither"]],
["Emotional Control","🧊","Emotional control means managing emotions appropriately. Professionals stay calm during conflict, stress and frustration.",["“They made me angry.”","Others influence feelings. You control your actions."],"How should professionals handle frustration?",["A customer starts yelling. What’s the professional response?","Stay calm and respond respectfully","Yell back","Walk off the job"],["Why does emotional control matter?","It stops conflicts from escalating and builds trust","It doesn’t","It means never feeling anything"]],
["Integrity","💎","Integrity means doing the right thing even when nobody is watching. Trust is one of the most valuable workplace assets.",["“The company won’t miss it.”","Dishonesty is still dishonesty."],"Why should integrity matter if nobody ever finds out?",["You find $50 on the floor and nobody sees. What shows integrity?","Turn it in","Keep it","Split it with a friend"],["Define integrity.","Doing right even when nobody’s watching","Doing right only when watched","Never making mistakes"]]
]],
["Teachability","📚","#51cf66","Learning and growing on the job.",[
["Following Instructions","📝","Following instructions means understanding and completing tasks correctly. Instructions improve safety, quality and consistency.",["“I know a better way.”","Learn the approved method first."],"Why should workers ask questions when they’re confused?",["What should you do if instructions confuse you?","Ask questions","Guess","Ignore them"],["One employee follows directions, another guesses. Who gets better results?","The one following directions","The guesser","Same results"]],
["Accepting Feedback","🗣️","Feedback is information that helps you improve. Every expert has been coached.",["“They’re criticizing me.”","Feedback usually helps you improve."],"Can someone improve without feedback?",["A manager suggests improvements. Who grows faster?","The one who listens","The one who gets defensive","Neither"],["How should workers respond to feedback?","Listen, say thanks and apply it","Argue back","Ignore it"]],
["Growth Mindset","🌱","Growth mindset means believing skills improve through effort and learning. Mistakes become opportunities. Say: “I’m not good at this YET.”",["“I’m just not talented.”","Most skills improve with practice."],"What skill have you improved through practice?",["What is a growth mindset?","Believing skills improve with effort","Believing talent is fixed","Avoiding all mistakes"],["How do mistakes help you?","They’re chances to learn","They prove you failed","They don’t"]]
]],
["Teamwork","🤝","#cc5de8","Winning together.",[
["Supporting Others","🙌","Supporting others means helping teammates succeed. Strong teams accomplish more than individuals.",["“Not my problem.”","Strong teams help each other."],"How does helping others benefit everyone?",["A coworker falls behind. What’s the best move?","Offer to help","Ignore them","Tell everyone"],["Why does supporting others matter?","Strong teams accomplish more","It doesn’t","It slows you down"]],
["Respectful Communication","💬","Communication includes speaking, listening and responding. Many workplace problems start with poor communication.",["“I just tell it like it is.”","Truth can be shared respectfully."],"What makes communication respectful?",["Two workers disagree. One interrupts, one listens. Who solves the problem?","The listener","The interrupter","Neither"],["How should disagreements be handled?","Calmly, listening first","By arguing louder","By avoiding everyone"]],
["Collaboration","🧩","Collaboration means working together toward a common goal. Different people bring different strengths: marketing, finance, operations, customer service.",["“I work better alone.”","Most careers require teamwork."],"Why do teams often outperform individuals?",["What is collaboration?","Working together toward a goal","Working alone","Competing with teammates"],["Why are different strengths valuable?","They cover more of what a project needs","They cause conflict","They aren’t valuable"]]
]]
];
const $=s=>document.querySelector(s);
let S={c:{},b:{},n:"Mike Martinez"};
try{S=Object.assign(S,JSON.parse(localStorage.getItem("rfw")||"{}"))}catch(e){}
const sv=()=>{try{localStorage.setItem("rfw",JSON.stringify(S))}catch(e){}};
const sh=a=>[...a].sort(()=>Math.random()-.5);
let F=null,Z=null;
const done=d=>D[d][4].every((_,i)=>S.c[d+"."+i]);
const stars=()=>Object.keys(S.c).length,badges=()=>Object.keys(S.b).length;
function home(){F=null;Z=null;draw()}
function openCard(d,i){F={d,i,s:0};Z=null;draw();scrollTo(0,0)}
function step(n){F.s=n;if(n==3)startQ(D[F.d][4][F.i].slice(5));draw();scrollTo(0,0)}
const MC=[
["Mission 1: Your car won’t start before work. What do you do?","Call your manager right away and explain","Wait until you’re at work to explain","Skip the shift and say nothing"],
["Mission 2: A customer starts yelling at you.","Stay calm, listen and offer help","Yell back","Walk away mid-shift"],
["Mission 3: Your manager changes the process you’ve used for months.","Learn the new method and ask questions","Keep doing it your way","Complain to coworkers"],
["Mission 4: Friends keep texting you during your shift.","Put your phone away until break","Reply quickly every time","Text back while helping customers"],
["Mission 5: A coworker is struggling with their part of a team project.","Offer help so the team succeeds","Only focus on your part","Tell the boss they’re lazy"],
["Mission 6: You find cash on the floor and nobody saw.","Turn it in to your manager","Keep it","Leave it there"],
["Mission 7: Your boss says your work needs improvement.","Listen, ask for specifics and improve","Defend yourself","Quit"],
["Mission 8: Everyone ignores a policy.","Follow it anyway; professionals meet expectations","Ignore it too","Ignore it unless you get caught"],
["Mission 9: A project is due today and you’re behind.","Stay focused, prioritize and ask for help if needed","Hope nobody notices","Rush and skip quality checks"],
["Mission 10: Why should the company promote you?","I’m dependable, productive, professional, teachable and a team player","I’ve been here the longest","My friends say I deserve it"]];
function openMaster(){F={m:1,s:3};startQ(MC);draw();scrollTo(0,0)}
function openExam(d){F={d,x:1,s:3};startQ(D[d][4].flatMap(c=>c.slice(5)));draw();scrollTo(0,0)}
function startQ(qs){Z={src:qs,r:null,qs:sh(qs).map(q=>({t:q[0],a:q[1],o:sh(q.slice(1)),s:null}))}}
function pick(q,o){if(Z.r)return;Z.qs[q].s=o;draw()}
function submitQ(){const sc=Z.qs.filter(q=>q.o[q.s]==q.a).length,ok=sc/Z.qs.length>=.8;Z.r={sc,n:Z.qs.length,ok};
 if(ok){if(F.m)S.m=1;else if(F.x)S.b[F.d]=1;else S.c[F.d+"."+F.i]=1;sv()}draw()}
function retry(){startQ(Z.src);draw();scrollTo(0,0)}
function finalView(){F={f:1};draw();scrollTo(0,0)}
function setName(v){S.n=v;sv();const e=$("#cn");if(e)e.textContent=v||"Your Name"}
function quizHtml(){let h="";
 Z.qs.forEach((q,qi)=>{h+=`<div class="card"><b>${qi+1}. ${q.t}</b>`;
  q.o.forEach((o,oi)=>{let c="opt";if(q.s==oi)c+=" sel";if(Z.r&&q.s==oi)c+=o==q.a?" good":" bad";
   h+=`<button class="${c}" ${Z.r?"disabled":""} onclick="pick(${qi},${oi})">${o}</button>`});h+="</div>"});
 if(!Z.r)h+=`<button class="btn" ${Z.qs.every(q=>q.s!=null)?"":"disabled"} onclick="submitQ()">Submit answers</button>`;
 else if(Z.r.ok)h+=`<div class="card win">🎉 ${Z.r.sc}/${Z.r.n} — Passed!</div><button class="btn" onclick="home()">${F.m?"Unlock your certificate 👑":F.x?"Collect your badge 🏅":"Collect your star ⭐"}</button>`;
 else h+=`<div class="card lose">${Z.r.sc}/${Z.r.n}. You need 80% to pass. Red answers were wrong. Review the cards if you need to, then try again.</div><button class="btn" onclick="retry()">🔁 Retry quiz</button>`;
 return h}
function flowHtml(){if(F.m)return `<div style="--dc:#ffc933"><button class="back" onclick="home()">← Back to map</button><h2>👑 Master Challenge</h2><p class="mu">10 workplace missions. Score 80% or higher to unlock your certificate. Retake as many times as you need.</p>`+quizHtml()+"</div>";
 const v=D[F.d],st=`style="--dc:${v[2]}"`;
 let h=`<div ${st}><button class="back" onclick="home()">← Back to map</button>`;
 if(F.x){return h+`<h2>${v[1]} ${v[0]} Badge Exam</h2><p class="mu">Answer every question. 80% or higher wins the badge. Retake as many times as you need.</p>`+quizHtml()+"</div>"}
 const c=v[4][F.i];
 h+=`<div class="dots">${[0,1,2,3].map(i=>`<i class="${i<=F.s?"on":""}"></i>`).join("")}</div>`;
 if(F.s==0)h+=`<div class="card"><h2>${c[1]} ${c[0]}</h2><p>${c[2]}</p></div><button class="btn" onclick="step(1)">Next</button>`;
 else if(F.s==1)h+=`<div class="card"><p class="x">❌ ${c[3][0]}</p><p class="g">✅ Professional reality: ${c[3][1]}</p></div><button class="btn" onclick="step(2)">Next</button>`;
 else if(F.s==2)h+=`<div class="card"><h2>🧠 Challenge</h2><p>${c[4]}</p><p class="mu">Think it over (or discuss it), then take the quiz.</p></div><button class="btn" onclick="step(3)">Start mini quiz</button>`;
 else h+=`<h2>${c[1]} ${c[0]} quiz</h2><p class="mu">Pass to earn the star and unlock the next card. Retakes are unlimited.</p>`+quizHtml();
 return h+"</div>"}
const ST=[];D.forEach((v,d)=>{v[4].forEach((c,i)=>ST.push({d,i,k:"c",e:c[1],n:c[0]}));ST.push({d,k:"x",e:"🏅",n:v[0]+" Badge"})});ST.push({k:"m",e:"👑",n:"Master Challenge"},{k:"f",e:"🏆",n:"Certified Workplace Professional"});
const RH=130,X=i=>50+30*Math.sin(i*1.1),Y=i=>i*RH+70;
const isDone=s=>s.k=="c"?!!S.c[s.d+"."+s.i]:s.k=="x"?!!S.b[s.d]:s.k=="m"?!!S.m:false;
const CUR=()=>ST.findIndex(s=>!isDone(s));
let AV=-1;
function go(i){const s=ST[i];if(s.k=="c")openCard(s.d,s.i);else if(s.k=="x")openExam(s.d);else if(s.k=="m")openMaster();else finalView()}
function homeHtml(){const n=ST.length,cur=CUR();
 let h=`<div class="top"><small>👤 ${S.n||"Mike Martinez"} · Future Industries trainee</small><h1>Ready for Work Academy</h1><p>Hop from station to station, pass every quiz, and become a <b>Certified Workplace Professional</b>.</p><div class="bds">${D.map((v,d)=>`<span class="bd ${S.b[d]?"on":""}" style="--c:${v[2]}" title="${v[0]}">${v[1]}</span>`).join("")}</div><div class="bar"><i style="width:${(stars()+badges()+(S.m?1:0))/21*100}%"></i></div><small>⭐ ${stars()}/15 stars &nbsp; 🏅 ${badges()}/5 badges</small></div><div class="map" style="height:${n*RH}px"><svg viewBox="0 0 100 ${n*RH}" preserveAspectRatio="none">`;
 for(let i=0;i<n-1;i++){const dn=i<cur;h+=`<path d="M${X(i)} ${Y(i)} C${X(i)} ${Y(i)+RH/2} ${X(i+1)} ${Y(i+1)-RH/2} ${X(i+1)} ${Y(i+1)}" fill="none" stroke="${dn?"#8b6cff":"#8c97cc66"}" stroke-width="${dn?5:3}" stroke-dasharray="${dn?"none":"3 9"}" vector-effect="non-scaling-stroke"/>`}
 h+="</svg>";
 ST.forEach((s,i)=>{const c=s.d===undefined?"#ffc933":D[s.d][2],st=i<cur?"done":i==cur?"cur":"lk";
  h+=`<button class="st ${s.k=="c"?"":"xm"} ${st}" style="left:${X(i)}%;top:${Y(i)}px;--c:${c}" ${i<=cur?`onclick="go(${i})"`:"disabled"} aria-label="${s.n}">${st=="lk"?"🔒":st=="done"&&s.k=="c"?"⭐":s.e}</button><div class="lb" style="left:${X(i)}%;top:${Y(i)+(s.k=="c"?44:52)}px">${s.n}</div>`});
 const a=AV<0?cur:AV;
 return h+`<div class="av" id="av" style="left:${X(a)}%;top:${Y(a)}px">🦊</div></div>`}
function afterHome(){const cur=CUR(),a=$("#av");if(!a)return;
 if(AV!=cur){requestAnimationFrame(()=>{a.classList.add("hop");a.style.left=X(cur)+"%";a.style.top=Y(cur)+"px"});AV=cur}
 setTimeout(()=>{const t=document.querySelector(".st.cur");if(t)t.scrollIntoView({block:"center",behavior:"smooth"})},60)}
function certHtml(){return `<button class="back" onclick="home()">← Back to map</button><div class="top"><h1>👑 You did it!</h1><p>All five badges earned. Type your name to get your certificate.</p></div>
<input placeholder="Your name" value="${(S.n||"").replace(/"/g,"&quot;")}" oninput="setName(this.value)">
<div class="cert"><div style="font-size:42px">🏆</div><h2>Ready for Work Master Certificate</h2><p>This certifies that</p><b class="n" id="cn">${S.n||"Your Name"}</b><p>is a <b>Certified Workplace Professional</b></p><p>⏰ Dependability · ⚙️ Productivity · 👔 Professionalism · 📚 Teachability · 🤝 Teamwork</p><p><small>${new Date().toLocaleDateString()}</small></p></div>
<button class="btn" onclick="print()">🖨️ Print or save as PDF</button>`}
function draw(){$("#app").innerHTML=F&&F.f?certHtml():F?flowHtml():homeHtml();if(!F)afterHome()}
draw();
</script></body></html>
